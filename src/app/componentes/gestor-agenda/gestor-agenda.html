<!-- Rangos horarios de UN médico en UNA fecha (los recibe por input() desde la página padre) -->
<div class="encabezado-seccion">
  <h3>Rangos horarios</h3>
  <!-- Abre el diálogo de alta. Se puede cargar más de un rango por día. -->
  <button mat-flat-button (click)="agregar()">
    <mat-icon>add</mat-icon>
    Agregar rango
  </button>
</div>

@if (cargando()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (rangos().length > 0) {
  <table mat-table [dataSource]="rangos()" class="tabla">
    <ng-container matColumnDef="horario">
      <th mat-header-cell *matHeaderCellDef>Horario</th>
      <td mat-cell *matCellDef="let rango">{{ rango.hora_entrada }} a {{ rango.hora_salida }}</td>
    </ng-container>

    <!-- El backend ya manda los nombres de especialidad y sede, no hace falta buscarlos por id -->
    <ng-container matColumnDef="especialidad">
      <th mat-header-cell *matHeaderCellDef>Especialidad</th>
      <td mat-cell *matCellDef="let rango">{{ rango.especialidad }}</td>
    </ng-container>

    <ng-container matColumnDef="sede">
      <th mat-header-cell *matHeaderCellDef>Sede</th>
      <td mat-cell *matCellDef="let rango">{{ rango.sede }}</td>
    </ng-container>

    <!-- Modificar abre el mismo diálogo que el alta, con los datos del rango.
         Si el backend lo rechaza (turnos confirmados afuera, superposición) se muestra su mensaje. -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let rango" class="acciones">
        <button mat-icon-button matTooltip="Modificar" (click)="editar(rango)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Eliminar" (click)="eliminar(rango)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
  </table>
} @else if (!cargando()) {
  <p class="vacio">No hay rangos horarios cargados para esta fecha.</p>
}
