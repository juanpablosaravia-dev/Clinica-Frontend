<!-- Datos de contacto de la clínica (los pide la consigna): dirección, teléfono, correo y redes. -->
<footer>
  <span class="marca">© Clínica Virtual</span>

  <div class="datos">
    <span class="dato">
      <mat-icon>location_on</mat-icon>
      Sede Centro: San Martín 123, Santa Fe
    </span>
    <span class="dato">
      <mat-icon>phone</mat-icon>
      (342) 400-0001
    </span>
    <span class="dato">
      <mat-icon>email</mat-icon>
      <!-- &#64; es el carácter "@": en los templates de Angular la @ sola se reserva para @if, @for, etc. -->
      contacto&#64;clinicavirtual.com
    </span>
  </div>

  <!-- Redes como botones de ícono. target="_blank" las abre en otra pestaña. -->
  <div class="redes">
    <a mat-icon-button href="https://www.instagram.com" target="_blank" aria-label="Instagram" title="Instagram">
      <mat-icon>photo_camera</mat-icon>
    </a>
    <a mat-icon-button href="https://www.facebook.com" target="_blank" aria-label="Facebook" title="Facebook">
      <mat-icon>thumb_up</mat-icon>
    </a>
  </div>
</footer>
