<!-- Datos de contacto: dirección de la sede, teléfono, correo y redes sociales -->
<footer>
  <div class="dato">
    <mat-icon>location_on</mat-icon>
    <span>Sede Centro: San Martín 123, Santa Fe</span>
  </div>
  <div class="dato">
    <mat-icon>phone</mat-icon>
    <span>(342) 400-0001</span>
  </div>
  <div class="dato">
    <mat-icon>email</mat-icon>
    <!-- &#64; es el carácter "@": en los templates de Angular la @ sola se reserva para @if, @for, etc. -->
    <span>contacto&#64;clinicavirtual.com</span>
  </div>
  <div class="dato">
    <!-- target="_blank" abre la red social en otra pestaña -->
    <a mat-button href="https://www.instagram.com" target="_blank">
      <mat-icon>photo_camera</mat-icon> Instagram
    </a>
    <a mat-button href="https://www.facebook.com" target="_blank">
      <mat-icon>thumb_up</mat-icon> Facebook
    </a>
  </div>
</footer>
